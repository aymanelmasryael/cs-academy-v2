    <rect x="129.58" y="32.4" width="32.4" height="32.4" fill="#0074FF"/>
    <rect y="194.38" width="32.4" height="32.4" fill="#0074FF"/>
    <rect x="32.4" y="194.38" width="32.4" height="32.4" fill="#0074FF"/>
    <rect x="64.79" y="194.38" width="32.4" height="32.4" fill="#0074FF"/>
    <rect x="97.19" y="194.38" width="32.4" height="32.4" fill="#0074FF"/>
    <rect x="129.58" y="194.38" width="32.4" height="32.4" fill="#FFD700"/>
    <rect x="161.98" y="194.38" width="32.4" height="32.4" fill="#FFD700"/>
    <rect x="194.38" y="194.38" width="32.4" height="32.4" fill="#FFD700"/>
  </g>

  <!-- Title -->
  <text x="640" y="210" font-family="Helvetica, sans-serif" font-size="34" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="-0.5">CS Academy V2 Scaffold</text>

  <!-- Subtitle -->
  <text x="640" y="252" font-family="Helvetica, sans-serif" font-size="16" fill="#64748B" text-anchor="middle" letter-spacing="0.3">Computer Science Problem Solving — Q&amp;A Engine</text>

  <!-- Divider -->
  <line x1="440" y1="282" x2="840" y2="282" stroke="url(#accentLine)" stroke-width="1" opacity="0.5"/>

  <!-- Specs row -->
  <g transform="translate(640, 330)">
    <rect x="-120" y="-16" width="240" height="32" rx="6" fill="#0074FF" fill-opacity="0.08" stroke="#0074FF" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="0" y="6" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#60A5FA" text-anchor="middle">10,000 records · 20 topics · 50/page</text>
  </g>

  <!-- Tags -->
  <g transform="translate(640, 390)">
    <rect x="-95" y="-14" width="88" height="28" rx="4" fill="#0074FF" fill-opacity="0.1" stroke="#0074FF" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="-51" y="6" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0074FF" text-anchor="middle">v0.1.0</text>
    <rect x="7" y="-14" width="88" height="28" rx="4" fill="#FFD700" fill-opacity="0.1" stroke="#FFD700" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="51" y="6" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#FFD700" text-anchor="middle">pre-release</text>
