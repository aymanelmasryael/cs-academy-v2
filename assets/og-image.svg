    <line x1="0" y1="-180" x2="0" y2="180" stroke="#0074FF" stroke-width="0.3"/>
  </g>

  <!-- Binary decoration -->
  <text x="80" y="80" font-family="'SF Mono', monospace" font-size="10" fill="#0074FF" opacity="0.08">
