    <tspan x="80" dy="16">01100011 01110011 01000010</tspan>
    <tspan x="80" dy="16">01100001 01100011 01100001</tspan>
    <tspan x="80" dy="16">01100100 01100101 01101101</tspan>
    <tspan x="80" dy="16">01111001 01000000 01100001</tspan>
    <tspan x="80" dy="16">01100101 01101100 00101110</tspan>
    <tspan x="80" dy="16">01100011 01101111 01101101</tspan>
